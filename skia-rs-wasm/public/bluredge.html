<!doctype html>
<meta charset="utf-8">
<title>linear-light blur check</title>
<style>
  body { margin: 0; background: #14181d; color: #dfe6ee; font: 13px ui-monospace, monospace; }
  .wrap { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  canvas { border: 1px solid #2b333c; display: block }
  h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; color: #9fb0c0; text-transform: uppercase }
  .cal { display: flex; gap: 0; margin-top: 6px; width: 600px }
  .sw { flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 11px; font-weight: 700 }
  #out { padding: 0 16px 16px; white-space: pre; color: #8fa }
</style>
<div class="wrap">
  <div>
    <h2>Calibration: the boundary of the blurred edge should now sit near the 188 swatch (linear), not 128 (gamma)</h2>
    <div class="cal">
      <div class="sw" style="background:#646464">100</div>
      <div class="sw" style="background:#808080">128 (gamma ½)</div>
      <div class="sw" style="background:#a0a0a0">160</div>
      <div class="sw" style="background:#bcbcbc">188 (linear ½)</div>
      <div class="sw" style="background:#d2d2d2">210</div>
    </div>
  </div>
  <div><h2>Classic vello — background blur over a black↔white edge</h2><canvas id="c-classic" width="600" height="200"></canvas></div>
  <div><h2>Hybrid vello</h2><canvas id="c-hybrid" width="600" height="200"></canvas></div>
</div>
<div id="out">booting…</div>
<script type="module">
const q = new URLSearchParams(location.search)
const R = Number(q.get('radius') ?? 60)
const W = 600, H = 200, EDGE = W / 2
const REC = 164
const out = document.getElementById('out')

async function boot(url) {
  const ns = await import(/* @vite-ignore */ url)
  const X = await ns.default(); const api = {}
  for (const k in X) api[k] = X[k]; api.memory = X.memory; api.create_focus_renderer = ns.create_focus_renderer
  return api
}
async function run(kind, canvasId) {
  const url = kind === 'classic' ? '/wasm-vello-gpu/render-vello-gpu.js' : '/wasm-vello/render-vello.js'
  const X = await boot(url + '?be=' + kind)
  const canvas = document.getElementById(canvasId)
  canvas.width = W; canvas.height = H
  X.init(W, H); X.set_render_options(0, 1); X.set_scheduler(1); X.set_tile_effects(1)
  const r = await X.create_focus_renderer(canvas)
  const u8 = () => new Uint8Array(X.memory.buffer), dv = () => new DataView(X.memory.buffer)
  const solid = (color) => {
    const size = 4 + REC, ptr = X.alloc_bytes(size)
    u8().fill(0, ptr, ptr + size); u8()[ptr] = 1; u8()[ptr + 4] = 0x00; dv().setUint32(ptr + 8, color, true)
    X.set_shape_fills()
  }
  const rect = (id, x0, y0, x1, y1, color) => {
    X.use_shape(0, 0, 0, id); X.set_shape_type(3); X.set_shape_selrect(x0, y0, x1, y1)
    if (color != null) solid(color)
  }
  const child = (id) => { X.use_shape(0, 0, 0, 0); X.add_shape_child(0, 0, 0, id) }
  X.init_shapes_pool(8)
  rect(1, 0, 0, EDGE, H, 0xff000000); child(1)                 // black left
  rect(2, EDGE, 0, W, H, 0xffffffff); child(2)                 // white right
  rect(3, 100, 20, W - 100, H - 20, null); X.set_shape_blur(1, false, R); child(3)  // background-blur lens
  X.set_view(1, 0, 0)
  const raf = () => new Promise((res) => requestAnimationFrame(res))
  for (let i = 0; i < 6; i++) { r.render(); await raf() }
}
Promise.allSettled([run('classic', 'c-classic'), run('hybrid', 'c-hybrid')]).then(() => {
  out.textContent = `radius=${R} · black↔white edge under a background blur.\n`
    + `Linear-light blur: the 50/50 boundary reads ~188 (bright). Old gamma-space blur read ~128 (dim).`
  window.__DONE__ = true
}).catch((e) => { window.__ERR__ = String(e && e.stack || e); out.textContent = 'ERROR ' + (e && e.stack || e) })
</script>
