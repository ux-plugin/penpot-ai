<!doctype html>
<meta charset="utf-8">
<title>vello bench</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px ui-monospace, monospace; }
  #c { display: block; }
  #out { position: fixed; top: 8px; left: 8px; white-space: pre; background: #000c; padding: 8px; max-height: 96vh; overflow: auto; }
</style>
<canvas id="c"></canvas>
<div id="out">booting…</div>
<script type="module">
// Standalone renderer benchmark: loads a vello backend directly, with NO app, no React, no
// document proxies — so the numbers are the renderer's, not the editor's.
//
//   /bench.html?backend=hybrid|classic&n=20000&depth=0&effects=none
//
//   depth    nesting: `depth` nested frames above the shapes (transform/clip stack depth)
//   effects  none | shadow | blur | both — applied to every `effectEvery`-th shape
//
// Shapes are built straight through the C ABI (the same entry points the app uses), so every
// backend rasterizes byte-identical input.

const q = new URLSearchParams(location.search)
const BACKEND = q.get('backend') ?? 'hybrid'
const N = Number(q.get('n') ?? 20000)
const FRAMES = Number(q.get('frames') ?? 40)
const W = Number(q.get('w') ?? 1600)
const H = Number(q.get('h') ?? 1000)
const DEPTH = Number(q.get('depth') ?? 0)
const EFFECTS = q.get('effects') ?? 'none'
const EFFECT_EVERY = Number(q.get('effectEvery') ?? 10)
// Blur radius for bgblur/blur/glass. Held or swept to separate per-pass overhead (round-trip) from
// blur compute: the backdrop is capped to a one-tile ring, so compute/blur is ~radius-invariant —
// if GPU time tracks pass COUNT and is flat vs RADIUS, the cost is the round-trip, not the math.
const RADIUS = Number(q.get('radius') ?? 6)
// Stacked-gather stress: `stack` concentric gather rects at the canvas centre, each nested inside the
// one below so every higher one covers the ones under it. This is the WORST case for the collapse —
// a genuine gather-on-gather dependency chain — so it should NOT collapse (deferrable≈1, passes≈stack).
// Contrast with the grid gathers (effects=bgblur|glass on scattered cells), which are independent and
// SHOULD collapse to one pass. Compare buckets 108-111 across the two to see the optimization's reach.
const STACK = Number(q.get('stack') ?? 0)
const STACK_FX = q.get('stackFx') ?? 'bgblur'
// Isolated topmost lenses: `lenses` fill-less blur rects spread across the canvas in a grid, each
// small enough that its sample rect (output + blur reach) never reaches a neighbour, and all added
// LAST so nothing is painted above them. This is the "panels over a background" case the collapse
// targets — every lens is topmost and independent, so they all defer into ONE batched pass.
const LENSES = Number(q.get('lenses') ?? 0)
// bgFill=1 lays one full-canvas opaque rect UNDER everything, so a lens's backdrop has no transparent
// gaps — isolates true blur fidelity from the grid's transparent-seam "show-through" artifact.
const BGFILL = Number(q.get('bgFill') ?? 0)

const out = document.getElementById('out')
const log = (s) => { out.textContent = s }

const URLS = {
  hybrid: '/wasm-vello/render-vello.js',
  classic: '/wasm-vello-gpu/render-vello-gpu.js',
}

// One solid fill record: 4-byte header (count) + one RAW_FILL_DATA_SIZE record.
// Record layout: tag u8 @0 (0x00 = Solid), payload @4, solid colour u32 @payload+0.
const REC = 164
const CELL = 40

function main() {
  const url = URLS[BACKEND]
  if (!url) { log('unknown backend ' + BACKEND); return }

  import(/* @vite-ignore */ url).then(async (mod) => {
    // `init()` returns the raw wasm instance exports — that is where the `#[no_mangle]` C-ABI
    // lives (and `memory`). `create_focus_renderer` is a wasm-bindgen item, on the namespace.
    const X = await mod.default()

    const canvas = document.getElementById('c')
    const dpr = 1 // pin to 1 so every backend rasterizes the same pixel count
    canvas.width = W; canvas.height = H
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px'

    X.init(W, H)
    X.set_render_options(0, dpr)
    X.set_scheduler(1)
    X.set_tile_effects(1)
    // Sink submit-batch size (steps per encoder). 0 = unbounded (whole frame in one encoder — the
    // case that OOMed). Default 32. Lets a sweep prove memory scales with batch size.
    if (X.set_sink_batch) X.set_sink_batch(Number(q.get('batch') ?? 32))
    // gatherBatch=0 forces the inline (pre-collapse) gather path — the A/B baseline for the batch.
    // Only override when the param is present, so the bench reflects the backend's own default
    // (the collapse currently ships OFF — it renders the wrong backdrop per lens).
    if (X.set_gather_batch && q.get('gatherBatch') !== null) X.set_gather_batch(Number(q.get('gatherBatch')))
    // canvasBg=<argb hex> gives the canvas an OPAQUE background, so a background blur's backdrop
    // composes over that colour instead of the default transparent clear — the veil test.
    if (X.set_canvas_background && q.get('canvasBg')) X.set_canvas_background(parseInt(q.get('canvasBg'), 16) >>> 0)

    window.__X__ = X // expose wasm exports for ad-hoc probing
    const renderer = await mod.create_focus_renderer(canvas)
    window.__R__ = renderer // so a probe can force a cold full redraw and diff it against the incremental frame

    // ---- scene ---------------------------------------------------------------------
    const u8 = () => new Uint8Array(X.memory.buffer)
    const dv = () => new DataView(X.memory.buffer)

    function solidFill(color) {
      const size = 4 + REC
      const ptr = X.alloc_bytes(size)
      u8().fill(0, ptr, ptr + size)
      u8()[ptr] = 1            // fill count
      u8()[ptr + 4] = 0x00     // record tag: Solid
      dv().setUint32(ptr + 8, color, true)
      X.set_shape_fills()
    }

    const cols = Math.ceil(Math.sqrt(N))
    const shapeXY = (i) => [(i % cols) * CELL, Math.floor(i / cols) * CELL]

    X.init_shapes_pool(N + DEPTH + STACK + LENSES + 16)

    // Opaque full-canvas backdrop as the first root child (lowest z), under the grid + lenses.
    if (BGFILL) {
      const id = N + DEPTH + STACK + LENSES + 5
      X.use_shape(0, 0, 0, id)
      X.set_shape_type(3)
      X.set_shape_selrect(0, 0, W, H)
      solidFill(0xff202028)
      X.use_shape(0, 0, 0, 0)
      X.add_shape_child(0, 0, 0, id)
    }

    // Nested frames above the shapes: root -> f1 -> ... -> fDEPTH -> shapes. This is what makes
    // the walk pay for a transform/clip stack rather than a flat list.
    const FRAME_BASE = N + 1
    let parent = [0, 0, 0, 0]
    for (let d = 0; d < DEPTH; d++) {
      const id = FRAME_BASE + d
      X.use_shape(0, 0, 0, id)
      X.set_shape_type(0)                       // Frame
      X.set_shape_selrect(0, 0, cols * CELL, cols * CELL)
      X.set_shape_clip_content(false)           // clipping would cull, hiding the depth cost
      X.use_shape(...parent)
      X.add_shape_child(0, 0, 0, id)
      parent = [0, 0, 0, id]
    }

    for (let i = 0; i < N; i++) {
      const [cx, cy] = shapeXY(i)
      X.use_shape(0, 0, 0, i + 1)
      X.set_shape_type(3)                       // Rect
      X.set_shape_selrect(cx + 2, cy + 2, cx + CELL - 2, cy + CELL - 2)
      const isEffect = EFFECTS !== 'none' && i % EFFECT_EVERY === 0
      // Gather lenses (bgblur/glass) stay fill-less so they are *pure lenses* — the batched gather
      // stage only collapses those (nothing composites over the blur). Everything else gets a fill so
      // there is a colourful backdrop to blur.
      const isGatherLens = isEffect && (EFFECTS === 'bgblur' || EFFECTS === 'glass')
      if (!isGatherLens) solidFill(0xff000000 | (i * 2654435761 & 0xffffff))
      if (isEffect) {
        // Two scheduler families:
        //   SPREAD  — own surface, composited onto every tile it overlaps (additive, no backdrop read).
        //     shadow = drop shadow;  blur = LAYER blur (blur_type 0, the shape's own paint).
        //   GATHER  — reads the backdrop beneath, so it forces a compose-backdrop + read pass.
        //     bgblur = BACKGROUND blur (blur_type 1);  glass = frosted glass.
        if (EFFECTS === 'shadow' || EFFECTS === 'both') X.add_shape_shadow(0x80000000, 8, 0, 4, 4, 0, false)
        if (EFFECTS === 'blur' || EFFECTS === 'both') X.set_shape_blur(0, false, RADIUS)
        if (EFFECTS === 'bgblur') X.set_shape_blur(1, false, RADIUS)
        if (EFFECTS === 'glass') X.set_shape_glass(0, 4, 8, 1.5, 0, 0.4, 1, 0.1, 0, 0, 0, 1, RADIUS, 3, 0)
      }
      X.use_shape(...parent)
      X.add_shape_child(0, 0, 0, i + 1)
    }

    // Concentric stacked gathers at the centre — a genuine gather-on-gather dependency chain. Each
    // higher (later, smaller) rect overlaps every rect below it, so only the topmost is "topmost in
    // its region": the collapse must refuse (deferrable≈1, estPasses≈STACK). The worst case, by design.
    const STACK_BASE = N + DEPTH + 2
    const cx = W / 2, cy = H / 2
    for (let s = 0; s < STACK; s++) {
      const id = STACK_BASE + s
      const half = 220 - s * 18
      X.use_shape(0, 0, 0, id)
      X.set_shape_type(3)                       // Rect
      X.set_shape_selrect(cx - half, cy - half, cx + half, cy + half)  // no fill: a pure gather lens
      if (STACK_FX === 'glass') X.set_shape_glass(0, 4, 8, 1.5, 0, 0.4, 1, 0.2, 0, 0, 0, 1, RADIUS, 3, 0)
      else X.set_shape_blur(1, false, RADIUS)   // blur_type 1 = background (gather)
      X.use_shape(...parent)
      X.add_shape_child(0, 0, 0, id)
    }

    // Isolated topmost blur lenses spread over the canvas — the collapse's best case.
    const LENS_BASE = N + DEPTH + STACK + 2
    if (LENSES > 0) {
      const lc = Math.ceil(Math.sqrt(LENSES))
      const cw = W / lc, ch = H / lc
      const half = Math.min(cw, ch) * 0.28   // small enough that output+reach stays inside its cell
      for (let s = 0; s < LENSES; s++) {
        const id = LENS_BASE + s
        const gx = (s % lc + 0.5) * cw, gy = (Math.floor(s / lc) + 0.5) * ch
        X.use_shape(0, 0, 0, id)
        X.set_shape_type(3)                       // Rect
        X.set_shape_selrect(gx - half, gy - half, gx + half, gy + half)  // no fill: pure lens
        if (STACK_FX === 'glass') X.set_shape_glass(0, 4, 8, 1.5, 0, 0.4, 1, 0.2, 0, 0, 0, 1, RADIUS, 3, 0)
        else X.set_shape_blur(1, false, RADIUS)   // background blur (gather)
        X.use_shape(...parent)
        X.add_shape_child(0, 0, 0, id)
      }
    }

    // ---- regimes -------------------------------------------------------------------
    const raf = () => new Promise((r) => requestAnimationFrame(r))
    const ZOOMS = [0.5, 0.8, 1.1, 1.4, 0.65, 0.95, 1.25, 1.55]

    function moveShape(id, dx, dy) {
      const [cx, cy] = shapeXY(id - 1)
      X.use_shape(0, 0, 0, id)
      X.set_shape_selrect(cx + 2 + dx, cy + 2 + dy, cx + CELL - 2 + dx, cy + CELL - 2 + dy)
    }

    const MODES = {
      // Nothing changes: every visible tile should come from cache. Floor cost of a frame.
      idle: () => { X.set_view(1, 0, 0) },
      // Constant scale, moving origin: cache stays valid, only newly-exposed tiles rebuild.
      pan: (i) => { X.set_view(1, (i * 13) % 2000, (i * 7) % 1200) },
      // A different zoom bucket each frame drops the whole cache => genuine full redraw.
      zoom: (i) => { X.set_view(ZOOMS[i % ZOOMS.length], 0, 0) },
      // One shape, sub-tile movement: the minimum dirty footprint.
      edit1: (i) => { X.set_view(1, 0, 0); moveShape(8, i % 40, i % 40) },
      // One shape hopping >1 tile (512px) per frame: it leaves one tile and enters another, so
      // the dirty set must cover both — a stricter test of the invalidation than a nudge.
      editFar: (i) => { X.set_view(1, 0, 0); moveShape(8, (i % 6) * 600, (i % 3) * 600) },
      // 50 shapes moved in one frame, scattered: many independent dirty rects at once.
      editMulti: (i) => {
        X.set_view(1, 0, 0)
        for (let k = 0; k < 50; k++) moveShape(1 + ((k * 137) % N), (i % 20) * 30, (i % 20) * 30)
      },
    }

    async function runMode(name) {
      const apply = MODES[name]
      for (let i = 0; i < 8; i++) { apply(i); renderer.render(); await raf() }
      X.prof_reset()
      let sum = 0, worst = 0, rendered = 0, reused = 0
      for (let i = 0; i < FRAMES; i++) {
        apply(i)
        const t0 = performance.now()
        renderer.render()
        const dt = performance.now() - t0
        sum += dt; if (dt > worst) worst = dt
        const s = X.last_tile_stats()
        rendered += (s >>> 16); reused += (s & 0xffff)
        await raf()
      }
      const b = [0, 1, 2, 3, 4, 5].map((i) => X.prof_read(i))
      // 10 paints · 11 composites · 12 gathers · 13 queue submissions
      const kinds = {
        paints: +(X.prof_read(10) / FRAMES).toFixed(1),
        composites: +(X.prof_read(11) / FRAMES).toFixed(1),
        gathers: +(X.prof_read(12) / FRAMES).toFixed(1),
        submits: +(X.prof_read(13) / FRAMES).toFixed(1),
        // bucket 7 = actual backend rasterize (render_to_texture) calls; the atlas is meant to keep
        // this well below the paint-step count. bucket 8/9 = texture-pool hits/misses.
        renders: +(X.prof_read(7) / FRAMES).toFixed(1),
        poolMiss: +(X.prof_read(9) / FRAMES).toFixed(1),
        // bucket 14 = run_graph executions (the blur/glass/custom pass-graph round-trips). This is the
        // real gather cost `renders` hides — the number the batched collapse is meant to crater.
        graphRuns: +(X.prof_read(14) / FRAMES).toFixed(1),
      }
      // Gather-collapse projection (buckets 108-111, last timed frame): total gathers vs how many
      // defer, the passes with the collapse applied vs `total` today, and the batched dispatch count.
      // gathersTotal→estPasses is the whole point: it should crater for independent grid gathers and
      // stay ≈ total for the stacked chain.
      const gather = {
        total: X.prof_read(108), deferrable: X.prof_read(109),
        estPasses: X.prof_read(110), batchedDispatches: X.prof_read(111),
      }
      // TEMP atlas_effects diagnostics (last timed frame): 100 cands · 101 widest · 102 tallest ·
      // 103 shelf-declined · 104 atlas height
      const dbg = { cands: X.prof_read(100), widest: X.prof_read(101), tallest: X.prof_read(102), declined: X.prof_read(103), atlasH: X.prof_read(104) }
      let frames = 0
      const t1 = performance.now()
      const sustainMs = Number(q.get('sustainMs') ?? 1500)
      while (performance.now() - t1 < sustainMs) { apply(frames); renderer.render(); frames++; await raf() }
      const fps = +(frames / ((performance.now() - t1) / 1000)).toFixed(1)
      return {
        cpuMsPerFrame: +(sum / FRAMES).toFixed(3),
        worstMs: +worst.toFixed(2),
        tilesRendered: +(rendered / FRAMES).toFixed(2),
        tilesReused: +(reused / FRAMES).toFixed(2),
        phases_ms: {
          build: +(b[0] / FRAMES).toFixed(3), scene: +(b[1] / FRAMES).toFixed(3),
          render: +(b[2] / FRAMES).toFixed(3), submit: +(b[3] / FRAMES).toFixed(3),
        },
        stepsPerFrame: +(b[5] / FRAMES).toFixed(1),
        kinds,
        gather,
        dbg,
        sustainedFps: fps,
        // CPU-vs-rest split. `cpuMsPerFrame` is wall time around the *blocking* render() call, so
        // it is CPU: scene building plus command encoding. `framePeriodMs` is the achieved period.
        // The difference is time the main thread was NOT executing render — vsync idle when we are
        // at 60, but under that it is present/GPU backpressure. So: residue ≈ 0 with fps well below
        // 60 => CPU-bound; a large residue => the GPU is the limiter.
        framePeriodMs: +(1000 / fps).toFixed(2),
        nonCpuMs: +(1000 / fps - sum / FRAMES).toFixed(2),
      }
    }

    const res = { backend: BACKEND, shapes: N, depth: DEPTH, effects: EFFECTS, radius: RADIUS, effectEvery: EFFECT_EVERY, stack: STACK, stackFx: STACK_FX, canvas: W + 'x' + H, modes: {} }
    // once=1: render exactly ONE fresh frame at view (1,0,0) and stop — no tile-cache reuse, so
    // gathers are actually rendered this frame. The clean A/B substrate (batched vs inline) that idle
    // can't give (idle blits cached tiles) and zoom can't give (its view differs frame to frame).
    if (Number(q.get('once') ?? 0)) {
      X.prof_reset()
      X.set_view(1, 0, 0)
      renderer.render()
      await raf()
      res.once = { graphRuns: X.prof_read(14), gatherTotal: X.prof_read(108), deferrable: X.prof_read(109) }
      window.__RESULT__ = res
      log(JSON.stringify(res, null, 2))
      return
    }
    const modeList = q.get('modes') ? q.get('modes').split(',') : ['idle', 'pan', 'zoom', 'edit1', 'editFar', 'editMulti']
    for (const name of modeList) {
      log(JSON.stringify(res, null, 2) + '\n\nrunning ' + name + '…')
      res.modes[name] = await runMode(name)
    }
    window.__RESULT__ = res
    log(JSON.stringify(res, null, 2))
  }).catch((e) => { window.__ERR__ = String(e && e.stack || e); log('ERROR ' + e) })
}

main()
</script>
