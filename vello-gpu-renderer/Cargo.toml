# R1 viability spike for the classic-Vello (WebGPU-compute) backend — see
# render-vello/docs/classic-vello-backend-plan.md. Proves `RenderingContext` (the trait scene.rs is
# written against) is implementable for classic `vello::Scene`, so the classic backend can consume our
# scene unchanged. Not yet a cdylib/wasm backend — that is Phase 2.
#
# Versions mirror render-vello/Cargo.toml (this crate is outside the vello workspace, so they are
# pinned by hand and MUST stay in step with vello/Cargo.toml's [workspace.dependencies]).
[package]
name = "vello-gpu-renderer"
version = "0.1.0"
description = "Classic-Vello (WebGPU compute) backend — R1 viability spike: RenderingContext for vello::Scene."
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "vello_gpu_renderer"
# cdylib for the wasm backend the host loads (its `#[no_mangle]` ABI + `create_focus_renderer`),
# rlib so the native pixel tests + other crates can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
render-core = { path = "../render-core" }
# The shared device-generic effect executor (compositor, glass, blur, custom pass-graph). Classic
# vello reuses it unchanged — its pipelines run on any wgpu device, including classic's.
render-vello-core = { path = "../render-vello-core" }

# The classic, compute-based vello renderer (WebGPU-only) — the whole point of this backend.
vello = { path = "../vello/vello" }
vello_common = { path = "../vello/sparse_strips/vello_common", default-features = false }
# Only for the `TextureId` / `SampleRect` names the RenderingContext trait leaks in
# `draw_texture_rects` (a hybrid type). The method is unimplemented on classic (external textures are
# a Capability we do not advertise). Flagged in the plan as a trait-neutrality wart.
vello_hybrid = { path = "../vello/sparse_strips/vello_hybrid" }
vello_example_scenes = { path = "../vello/sparse_strips/vello_example_scenes" }
glifo = { path = "../vello/glifo", default-features = false }

# Classic vello's `Renderer`/`render_to_texture` need wgpu directly. Pinned to the fork's wgpu, same
# as render-vello. No `webgl` feature: classic is WebGPU-only (that's the point — compute rasterization).
wgpu = { version = "29.0.3" }

log = "0.4.29"

# The wasm backend shell: a `create_focus_renderer` over a host `<canvas>` + the browser console
# wiring. wasm-only so the native rlib + tests stay lean. Mirrors render-vello's versions (this crate
# is outside the vello workspace, so pinned by hand and kept in step with vello/Cargo.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.91"
web-sys = { version = "0.3.91", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0"

[dev-dependencies]
# Headless native render + readback proof (no browser): block on wgpu's async device/adapter/map.
pollster = "0.4"
# Encode the readback buffer to a PNG proof (already in the tree via the vello graphics stack).
png = "0.18"
# Text proofs: map chars → glyph ids and read advances without pulling in a full layout engine.
skrifa = "0.43"
# Text-block proof: build a Parley FontContext/LayoutContext and register a face, to drive the
# neutral text layout path end to end. Pinned to render-vello-core's parley.
parley = { version = "0.11.0", default-features = false, features = ["std"] }
