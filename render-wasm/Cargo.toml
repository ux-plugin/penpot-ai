[package]
name = "render"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/penpot/penpot"
license-file = "../LICENSE"
description = "Wasm-based canvas renderer for Penpot"

build = "build.rs"

[features]
default = []
# Permanent perf instrumentation. Adds a thread-local accumulator and
# RAII guards around hot-path sites (per Step, per EffectKey, per
# render_shape sub-phase). Surfaces a snapshot via `dump_perf_snapshot`
# exported fn.
perf-trace = []
profile = ["profile-macros", "profile-raf"]
profile-macros = []
profile-raf = []

[[bin]]
name = "render_wasm"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bezier-rs = "0.4.0"
gl = "0.14.0"
glam = "0.24.2"
indexmap = "2.7.1"
lru = "0.12"
macros = { path = "macros" }
rustc-hash = "2.1"
skia-safe = { version = "0.93.1", default-features = false, features = [
  "gl",
  "svg",
  "textlayout",
  "binary-cache",
  "webp",
] }
thiserror = "2.0.18"
uuid = { version = "1.11.0", features = ["v4", "js"] }

[profile.release]
opt-level = "s"
