[package]
name = "render"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/penpot/penpot"
license-file = "../LICENSE"
description = "Wasm-based canvas renderer for Penpot"

build = "build.rs"

[features]
default = []
profile = ["profile-macros", "profile-raf"]
profile-macros = []
profile-raf = []

[[bin]]
name = "render_wasm"
path = "src/main.rs"

[dependencies]
anim-runtime = { path = "../zoetrope-editor/anim-runtime" }
base64 = "0.22.1"
bezier-rs = "0.4.0"
curve-bool = { path = "curve-bool" }
gl = "0.14.0"
glam = "0.24.2"
indexmap = "2.7.1"
kurbo = "0.13"
lru = "0.12"
render-macros = { path = "../render-macros" }
render-core = { path = "../render-core" }
rustc-hash = "2.1"
skia-safe = { version = "0.93.1", default-features = false, features = [
  "gl",
  "svg",
  "textlayout",
  "binary-cache",
  "webp",
] }
thiserror = "2.0.18"
uuid = { version = "1.11.0", features = ["v4", "js"] }

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
