[package]
name = "render-vello"
version = "0.1.0"
description = "The Vello rendering backend: a wasm-bindgen module that renders a backend-neutral render-core scene. Peer to render-wasm (Skia); the host loads exactly one."
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "render_vello"
crate-type = ["cdylib", "rlib"]

# NOTE: this crate deliberately lives OUTSIDE the `vello/` submodule and depends *into* it,
# rather than being an example inside it that depends back out at the superproject. That keeps
# the fork a clean, rebaseable fork carrying only the engine change (`FilterPrimitive::Custom`).
#
# The cost of leaving vello's workspace is right here: every version below was `workspace = true`
# and is now pinned by hand. They MUST stay in step with `vello/Cargo.toml`'s
# `[workspace.dependencies]` — wgpu especially, since two incompatible wgpu copies in one graph
# fail in confusing ways. When bumping the submodule, re-check this block against it.
[dependencies]
render-core = { path = "../core" }
# The backend-agnostic wgpu effect executor (compositor, glass, blur, custom pass-graph) + profiler,
# carved out so the classic-vello sink shares it. This crate re-exports its modules as `crate::blend`
# / `crate::graph` / `crate::glass` / `crate::prof` so the sink's existing paths are unchanged.

vello_common = { path = "../vello/sparse_strips/vello_common", default-features = false }
vello_hybrid = { path = "../vello/sparse_strips/vello_hybrid" }

# Text: Parley lays out the glyphs render-vello draws (render-wasm uses Skia's textlayout; the two
# shapers differ, which is why the neutral model carries text *input*, not resolved glyphs). Pinned
# to the submodule's own versions — `vello_example_scenes` already links these, so they must unify
# (a second `peniko`/`fontique` copy would make Parley's `FontData` a different type from the one
# `glyph_run` wants). `std` without `system` fonts: on wasm there are none, so the host uploads
# every face into a Parley collection we control (`store_font`).
parley = { version = "0.11.0", default-features = false, features = ["std"] }
glifo = { path = "../vello/glifo", default-features = false }
# `run.normalized_coords()` is `&[i16]`; the glyph-run builder wants `&[NormalizedCoord]` (also
# i16-repr). A zero-copy cast bridges them, exactly as the vello text example does.
bytemuck = "1.25.0"
# Transitional: the demo/evaluation scenes still live in the fork's example harness. A
# production render-vello should not link them — they go when the live data path (Phase 2)
# replaces the hand-built scene.
vello_example_scenes = { path = "../vello/sparse_strips/vello_example_scenes" }

wgpu = { version = "29.0.3", features = ["webgl"] }

wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.91"
web-sys = { version = "0.3.91", features = [
    "Window",
    "Document",
    "Element",
    "Performance",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "WebGl2RenderingContext",
    "KeyboardEvent",
] }

console_error_panic_hook = "0.1.7"
console_log = "1.0"
log = "0.4.29"
