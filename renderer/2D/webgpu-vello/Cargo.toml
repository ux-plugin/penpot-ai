[package]
name = "vello-gpu-renderer"
version = "0.1.0"
description = "Classic-Vello (WebGPU compute) backend — R1 viability spike: RenderingContext for vello::Scene."
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "vello_gpu_renderer"
crate-type = ["cdylib", "rlib"]

[features]
gpu-profiler = ["vello/wgpu-profiler", "dep:wgpu-profiler"]

[dependencies]
render-core = { path = "../core", default-features = false }

vello = { path = "../vello/vello" }
wgpu-profiler = { version = "0.27.0", optional = true }
vello_encoding = { path = "../vello/vello_encoding" }
vello_common = { path = "../vello/sparse_strips/vello_common", default-features = false }
vello_hybrid = { path = "../vello/sparse_strips/vello_hybrid" }
vello_example_scenes = { path = "../vello/sparse_strips/vello_example_scenes" }
glifo = { path = "../vello/glifo", default-features = false }

wgpu = { version = "29.0.3" }

bytemuck = "1.25.0"
rustc-hash = "2"

log = "0.4.29"
futures-intrusive = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.91"
web-sys = { version = "0.3.91", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0"

[dev-dependencies]
render-core = { path = "../core", features = ["tiled-scheduler"] }
pollster = "0.4"
png = "0.18"
skrifa = "0.43"
parley = { version = "0.11.0", default-features = false, features = ["std"] }
