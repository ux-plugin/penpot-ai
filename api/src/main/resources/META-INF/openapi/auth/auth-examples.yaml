OAuthInitResponse:
  auth0_login:
    summary: Auth0 OAuth initialization
    description: Example response for Auth0 OAuth login initiation
    value:
      readToken: "auth0-read-token:5e2f4a73c7"
      loginUrl: "https://your-tenant.auth0.com/authorize?response_type=code&client_id=abc123&redirect_uri=http://localhost:8080/auth/auth0/callback&scope=openid+profile+email+offline_access&audience=figma-plugin&state=csrf_state_xyz789"

AccessTokenResponse:
  figma_token:
    summary: Figma access token
    description: Example Figma access token response (returned by /auth/figma/connect/* flows)
    value:
      accessToken: "figd_U2FsdGVkX1-figma-access-token-example-hash"

  github_token:
    summary: GitHub access token
    description: Example GitHub access token response (returned by /auth/github/connect/* flows)
    value:
      accessToken: "ghp_github-personal-access-token-example-hash"

ErrorResponses:
  unauthorized:
    summary: Unauthorized access error
    description: Error when user is not authenticated
    value:
      error: "unauthorized"
      message: "Authentication required. Please provide a valid JWT token"
      timestamp: "2024-08-06T16:01:00Z"

  server_error:
    summary: Internal server error
    description: Generic server error response
    value:
      error: "internal_server_error"
      message: "An unexpected error occurred. Please try again later"
      timestamp: "2024-08-06T16:01:00Z"
