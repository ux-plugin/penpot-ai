spring:
  application:
    name: figma-plugin-processor

  main:
    web-application-type: none

  liquibase:
    enabled: false

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:figma_plugin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 70000ms
      lettuce:
        pool:
          max-active: ${REDIS_MAX_POOL_SIZE:50}
          max-idle: 10
          min-idle: 5
          max-wait: ${REDIS_MAX_WAITING:100}ms
        shutdown-timeout: 5000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.plugin: ${APP_LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
