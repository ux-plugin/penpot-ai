# Templates only. Copy each Secret to its own file, fill in real values, apply,
# and DO NOT commit the realized files. Each pipeline stage gets its own Secret
# so that a single compromised pod leaks credentials scoped to that stage's
# prefix only.
#
# The S3 access keys are produced by the OpenTofu module under
# deploy/iac/opentofu/ — run `tofu output stage_credentials` to get them.
# See deploy/iac/opentofu/README.md for a kubectl one-liner that pulls the
# values straight into the Secrets below.

---
# Shared cross-cutting secrets (DB password, OAuth client secrets, AI provider keys).
apiVersion: v1
kind: Secret
metadata:
  name: ingest-pipeline-shared-secrets
  labels:
    app.kubernetes.io/part-of: ingest-pipeline
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "REPLACE_ME"

  AUTH_FIGMA_CLIENT_ID: "REPLACE_ME"
  AUTH_FIGMA_CLIENT_SECRET: "REPLACE_ME"
  AUTH_GITHUB_CLIENT_ID: "REPLACE_ME"
  AUTH_GITHUB_CLIENT_SECRET: "REPLACE_ME"

  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  GEMINI_API_KEY: "REPLACE_ME"

---
# Per-stage S3 credentials. The values are the access keys created by the
# OpenTofu IAM module under deploy/iac/opentofu/ — one IAM user per stage with
# a scoped inline policy.

apiVersion: v1
kind: Secret
metadata:
  name: api-s3-creds
  labels:
    app.kubernetes.io/part-of: ingest-pipeline
    app.kubernetes.io/name: api
type: Opaque
stringData:
  OBJECTSTORE_ACCESS_KEY: "REPLACE_ME"  # ingest-api policy: s3:PutObject raw/*
  OBJECTSTORE_SECRET_KEY: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: sanitizer-s3-creds
  labels:
    app.kubernetes.io/part-of: ingest-pipeline
    app.kubernetes.io/name: sanitizer
type: Opaque
stringData:
  SANITIZER_S3_ACCESS_KEY: "REPLACE_ME"  # sanitizer policy: GET+PUT+DELETE on raw/, quarantine/
  SANITIZER_S3_SECRET_KEY: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: anonymizer-s3-creds
  labels:
    app.kubernetes.io/part-of: ingest-pipeline
    app.kubernetes.io/name: anonymizer
type: Opaque
stringData:
  ANONYMIZER_S3_ACCESS_KEY: "REPLACE_ME"  # anonymizer policy: GET raw/, GET+PUT anon/
  ANONYMIZER_S3_SECRET_KEY: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: processor-s3-creds
  labels:
    app.kubernetes.io/part-of: ingest-pipeline
    app.kubernetes.io/name: processor
type: Opaque
stringData:
  PROCESSOR_S3_ACCESS_KEY: "REPLACE_ME"  # processor policy: GET anon/ only
  PROCESSOR_S3_SECRET_KEY: "REPLACE_ME"
