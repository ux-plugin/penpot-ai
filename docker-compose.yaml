services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api
    ports:
      - "8080:8080"
    environment:
      # Spring Boot profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      
      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-figma_plugin}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Server configuration
      - API_PORT=8080
      - API_HOST=0.0.0.0
      
      # OpenAI configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PROJECT_ID=${OPENAI_PROJECT_ID}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      
      # Fireworks AI configuration
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      
      # Auth configuration - Figma
      - AUTH_FIGMA_CLIENT_ID=${AUTH_FIGMA_CLIENT_ID}
      - AUTH_FIGMA_CLIENT_SECRET=${AUTH_FIGMA_CLIENT_SECRET}
      
      # Auth configuration - GitHub
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET}
      
      # Object store (MinIO) — api uses the per-stage `ingest-api` credentials
      # seeded by minio-init. Compromise of these keys gives only `s3:PutObject raw/*`.
      - OBJECTSTORE_ENDPOINT=${OBJECTSTORE_ENDPOINT:-http://minio:9000}
      - OBJECTSTORE_BUCKET=${OBJECTSTORE_BUCKET:-zoetrope-data}
      - OBJECTSTORE_ACCESS_KEY=${INGEST_API_S3_ACCESS_KEY:-ingest-api-key}
      - OBJECTSTORE_SECRET_KEY=${INGEST_API_S3_SECRET_KEY:-ingest-api-secret}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: figma_plugin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis service — persistence enabled so streams + sanitizer state survive a Redis restart.
  # Without AOF the entire pipeline state is lost on container crash, including in-flight
  # chunks (see Notion design contract: data protection / Redis crash). maxmemory-policy is
  # noeviction so a full Redis returns errors to producers (ingest 503s) instead of silently
  # evicting stream entries.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # MinIO object store (S3-compatible)
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # MinIO bootstrap. Three jobs:
  #   1. Create the data bucket and apply prefix-scoped lifecycle rules. raw/ is
  #      short-lived (1d MinIO ILM minimum; sanitizer normally evicts in seconds via
  #      the two-phase delete with anonymizer). quarantine/ holds 7d for ops review.
  #      anon/ keeps anonymized chunks for 90d.
  #   2. Install the per-stage policies under deploy/minio-policies/ (one JSON file
  #      per worker — least-privilege scoped to the prefixes that worker actually
  #      touches; see deploy/minio-policies/README.md).
  #   3. Create one MinIO service account per stage and bind it to its policy.
  #      Credentials are env-driven so they match the values the workers read from
  #      their application.yaml.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECTSTORE_BUCKET: ${OBJECTSTORE_BUCKET:-zoetrope-data}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      INGEST_API_S3_ACCESS_KEY: ${INGEST_API_S3_ACCESS_KEY:-ingest-api-key}
      INGEST_API_S3_SECRET_KEY: ${INGEST_API_S3_SECRET_KEY:-ingest-api-secret}
      SANITIZER_S3_ACCESS_KEY: ${SANITIZER_S3_ACCESS_KEY:-sanitizer-key}
      SANITIZER_S3_SECRET_KEY: ${SANITIZER_S3_SECRET_KEY:-sanitizer-secret}
      ANONYMIZER_S3_ACCESS_KEY: ${ANONYMIZER_S3_ACCESS_KEY:-anonymizer-key}
      ANONYMIZER_S3_SECRET_KEY: ${ANONYMIZER_S3_SECRET_KEY:-anonymizer-secret}
      PROCESSOR_S3_ACCESS_KEY: ${PROCESSOR_S3_ACCESS_KEY:-processor-key}
      PROCESSOR_S3_SECRET_KEY: ${PROCESSOR_S3_SECRET_KEY:-processor-secret}
    volumes:
      - ./deploy/minio-policies:/policies:ro
    entrypoint: >
      /bin/sh -c "
      set -e &&
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$OBJECTSTORE_BUCKET &&
      mc ilm rule add --prefix raw/        --expire-days 1  local/$$OBJECTSTORE_BUCKET || true &&
      mc ilm rule add --prefix quarantine/ --expire-days 7  local/$$OBJECTSTORE_BUCKET || true &&
      mc ilm rule add --prefix anon/       --expire-days 90 local/$$OBJECTSTORE_BUCKET || true &&
      mkdir -p /tmp/policies &&
      for stage in ingest-api sanitizer anonymizer processor; do
        sed \"s/zoetrope-data/$$OBJECTSTORE_BUCKET/g\" /policies/$$stage.json > /tmp/policies/$$stage.json;
        mc admin policy create local $$stage /tmp/policies/$$stage.json || mc admin policy update local $$stage /tmp/policies/$$stage.json;
      done &&
      seed_user() {
        mc admin user add local \"$$1\" \"$$2\" || mc admin user enable local \"$$1\";
        mc admin policy attach local \"$$3\" --user \"$$1\" || true;
      } &&
      seed_user \"$$INGEST_API_S3_ACCESS_KEY\"  \"$$INGEST_API_S3_SECRET_KEY\"  ingest-api &&
      seed_user \"$$SANITIZER_S3_ACCESS_KEY\"   \"$$SANITIZER_S3_SECRET_KEY\"   sanitizer &&
      seed_user \"$$ANONYMIZER_S3_ACCESS_KEY\"  \"$$ANONYMIZER_S3_SECRET_KEY\"  anonymizer &&
      seed_user \"$$PROCESSOR_S3_ACCESS_KEY\"   \"$$PROCESSOR_S3_SECRET_KEY\"   processor &&
      echo 'minio bucket + lifecycle + per-stage policies + service accounts ready'
      "
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  app-network:
    driver: bridge
