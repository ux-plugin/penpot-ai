services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api
    ports:
      - "8080:8080"
    environment:
      # Spring Boot profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      
      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-figma_plugin}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # Kafka bootstrap (Redpanda). Pipeline producer/consumer for the SCS + Kafka
      # Streams workers. See core/pipeline/Topics.kt for the canonical topic names.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

      # Server configuration
      - API_PORT=8080
      - API_HOST=0.0.0.0
      
      # OpenAI configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PROJECT_ID=${OPENAI_PROJECT_ID}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      
      # Fireworks AI configuration
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      
      # Auth configuration - Figma
      - AUTH_FIGMA_CLIENT_ID=${AUTH_FIGMA_CLIENT_ID}
      - AUTH_FIGMA_CLIENT_SECRET=${AUTH_FIGMA_CLIENT_SECRET}
      
      # Auth configuration - GitHub
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET}
      
      # Object store (MinIO). Env-var name matches the production layout
      # (per-stage credentials provisioned by deploy/iac/opentofu/); in dev we
      # default to the MinIO root since per-stage isolation is unnecessary
      # locally.
      - OBJECTSTORE_ENDPOINT=${OBJECTSTORE_ENDPOINT:-http://minio:9000}
      - OBJECTSTORE_BUCKET=${OBJECTSTORE_BUCKET:-zoetrope-data}
      - OBJECTSTORE_ACCESS_KEY=${INGEST_API_S3_ACCESS_KEY:-minioadmin}
      - OBJECTSTORE_SECRET_KEY=${INGEST_API_S3_SECRET_KEY:-minioadmin}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Sanitizer worker — consumes chunks.raw, classifies per-chunk, emits chunks.sanitized
  # and sessions.closed via Kafka Streams session windows.
  sanitizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: sanitizer
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OBJECTSTORE_ENDPOINT=${OBJECTSTORE_ENDPOINT:-http://minio:9000}
      - OBJECTSTORE_BUCKET=${OBJECTSTORE_BUCKET:-zoetrope-data}
      - SANITIZER_S3_ACCESS_KEY=${SANITIZER_S3_ACCESS_KEY:-minioadmin}
      - SANITIZER_S3_SECRET_KEY=${SANITIZER_S3_SECRET_KEY:-minioadmin}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-DEBUG}
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Anonymizer worker — consumes chunks.sanitized, scrubs PII per chunk, emits chunks.anonymized.
  anonymizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: anonymizer
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OBJECTSTORE_ENDPOINT=${OBJECTSTORE_ENDPOINT:-http://minio:9000}
      - OBJECTSTORE_BUCKET=${OBJECTSTORE_BUCKET:-zoetrope-data}
      - ANONYMIZER_S3_ACCESS_KEY=${ANONYMIZER_S3_ACCESS_KEY:-minioadmin}
      - ANONYMIZER_S3_SECRET_KEY=${ANONYMIZER_S3_SECRET_KEY:-minioadmin}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-DEBUG}
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Processor worker — consumes chunks.anonymized + sessions.closed, derives metadata,
  # writes Postgres via R2DBC.
  processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: processor
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-figma_plugin}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OBJECTSTORE_ENDPOINT=${OBJECTSTORE_ENDPOINT:-http://minio:9000}
      - OBJECTSTORE_BUCKET=${OBJECTSTORE_BUCKET:-zoetrope-data}
      - PROCESSOR_S3_ACCESS_KEY=${PROCESSOR_S3_ACCESS_KEY:-minioadmin}
      - PROCESSOR_S3_SECRET_KEY=${PROCESSOR_S3_SECRET_KEY:-minioadmin}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: figma_plugin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis service — persistence enabled so streams + sanitizer state survive a Redis restart.
  # Without AOF the entire pipeline state is lost on container crash, including in-flight
  # chunks (see Notion design contract: data protection / Redis crash). maxmemory-policy is
  # noeviction so a full Redis returns errors to producers (ingest 503s) instead of silently
  # evicting stream entries.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # MinIO object store (S3-compatible)
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    # Host ports remapped to avoid clash with penpot-devenv-main (which already owns
    # 9000/9001 on this machine). Internal docker-network port stays 9000, so the
    # api + workers still reach MinIO via http://minio:9000.
    ports:
      - "9300:9000"
      - "9301:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # MinIO bootstrap: create the data bucket and apply prefix-scoped lifecycle rules.
  # raw/ is short-lived (1d MinIO ILM minimum; sanitizer normally evicts in seconds
  # via the two-phase delete with anonymizer). quarantine/ is held for 7d for ops
  # review. anon/ keeps anonymized chunks for 90d.
  #
  # Dev uses the MinIO root credentials for every stage — per-stage IAM isolation
  # is enforced in production via the OpenTofu module under deploy/iac/opentofu/.
  # The application code reads the same env-var names in both environments
  # (SANITIZER_S3_ACCESS_KEY etc.); only the values differ.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECTSTORE_BUCKET: ${OBJECTSTORE_BUCKET:-zoetrope-data}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      set -e &&
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$OBJECTSTORE_BUCKET &&
      mc ilm rule add --prefix raw/        --expire-days 1  local/$$OBJECTSTORE_BUCKET || true &&
      mc ilm rule add --prefix quarantine/ --expire-days 7  local/$$OBJECTSTORE_BUCKET || true &&
      mc ilm rule add --prefix anon/       --expire-days 90 local/$$OBJECTSTORE_BUCKET || true &&
      echo 'minio bucket + lifecycle rules ready'
      "
    networks:
      - app-network

  # Kafka (via Redpanda — Kafka-protocol-compatible, single binary, no Zookeeper).
  # Pipeline bus for the Spring Cloud Stream + Kafka Streams workers. Replaces the
  # Redis Streams pipeline. Redis stays around for cache/state hashes but no longer
  # carries the chunk flow.
  kafka:
    image: redpandadata/redpanda:v24.2.7
    container_name: figma_plugin_api-kafka-1
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=kafka:33145
      - --advertise-rpc-addr=kafka:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka API for host-side tooling (rpk, kcat)
      - "18082:18082"   # pandaproxy (REST → Kafka)
      - "18081:8081"    # schema registry (unused in v1 — JSON serdes)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - kafka_data:/var/lib/redpanda/data
    networks:
      - app-network

  # Kafka admin UI — topics, consumer groups, lag, message inspection. Optional but
  # very useful while iterating on the topology.
  kafka-ui:
    image: redpandadata/console:v2.7.2
    container_name: figma_plugin_api-kafka-ui-1
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://kafka:8081
    ports:
      - "18080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  redis_data:

networks:
  app-network:
    driver: bridge
