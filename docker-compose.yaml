services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api
    ports:
      - "8080:8080"
    environment:
      # Spring Boot profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      
      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-figma_plugin}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Server configuration
      - API_PORT=8080
      - API_HOST=0.0.0.0
      
      # OpenAI configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PROJECT_ID=${OPENAI_PROJECT_ID}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID}
      
      # Fireworks AI configuration
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
      
      # Auth configuration - Figma
      - AUTH_FIGMA_CLIENT_ID=${AUTH_FIGMA_CLIENT_ID}
      - AUTH_FIGMA_CLIENT_SECRET=${AUTH_FIGMA_CLIENT_SECRET}
      
      # Auth configuration - GitHub
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET}
      
      # Object store (MinIO)
      - OBJECTSTORE_ENDPOINT=${OBJECTSTORE_ENDPOINT:-http://minio:9000}
      - OBJECTSTORE_BUCKET=${OBJECTSTORE_BUCKET:-zoetrope-raw}
      - OBJECTSTORE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - OBJECTSTORE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: figma_plugin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # MinIO object store (S3-compatible)
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # MinIO bootstrap: create bucket on startup
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${OBJECTSTORE_BUCKET:-zoetrope-raw} &&
      echo 'minio bucket ready'
      "
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
