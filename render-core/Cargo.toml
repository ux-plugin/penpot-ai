[package]
name = "render-core"
version = "0.1.0"
edition = "2021"
description = "Backend-neutral core for the Penpot renderer: geometry/color atoms and (later) the scene model, document state, and tile/SSA scheduler. Compiles with NO Skia and NO Emscripten so it can be shared by the Skia backend (render-wasm) and a future Vello backend."
publish = false

[lib]
# Plain rlib: this crate must build for BOTH wasm32-unknown-emscripten (Skia module)
# and wasm32-unknown-unknown (Vello/wasm-bindgen module), so it carries no backend deps.

[dependencies]
# Versions pinned to match the vello fork's workspace, so the Vello module and render-wasm
# share one kurbo/peniko rather than linking two incompatible copies.
kurbo = "0.13.1"
peniko = "0.6.1"

[dev-dependencies]
