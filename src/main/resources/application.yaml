# Quarkus YAML configuration
quarkus:
  application:
    name: figma-plugin-api

  # HTTP configuration
  http:
    port: "${API_PORT:8003}"
    host: "${API_HOST:0.0.0.0}"

    # CORS configuration
    cors:
      enabled: true
      origins: "*"
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      headers: Authorization,Content-Type,Accept,Cache-Control,Upgrade,Connection,Sec-WebSocket-Key,Sec-WebSocket-Version,Sec-WebSocket-Protocol,Sec-WebSocket-Extensions
      exposed-headers: Content-Disposition
      access-control-max-age: 3600

  # OpenAPI and Swagger UI
  swagger-ui:
    always-include: true
    validator-url: none
  smallrye-openapi:
    info-title: Figma Plugin API
    info-version: 0.0.1
    info-description: API for Figma Plugin
    path: /openapi
    additional-docs-directory: src/main/resources/META-INF/openapi
    enabled: true

  # Database configuration
  datasource:
    db-kind: postgresql
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:password}"
    reactive:
      url: "postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:figma_plugin}"

    # JDBC configuration for liquibase
    jdbc:
      url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:figma_plugin}"
      driver: org.postgresql.Driver

  # Redis configuration
  redis:
    hosts: "${REDIS_HOST:redis://localhost:6379}"
    timeout: 10000
    # Connection pool configuration
    max-pool-size: "${REDIS_MAX_POOL_SIZE:50}"
    max-pool-waiting: "${REDIS_MAX_WAITING:100}"
    pool-cleaner-interval: 30000
    pool-recycle-timeout: 15000
    connect-timeout: 5000
    reconnect-attempts: 3
    reconnect-interval: 1000

  # Hibernate ORM configuration
  hibernate-orm:
    log:
      sql: true
    physical-naming-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    schema-management:
      strategy: validate

  # Liquibase configuration
  liquibase:
    migrate-at-start: true
    change-log: db/changelog/master.yaml

  rest-client:
    ai-server:
      url: "${AI_SERVER_URL:http://localhost:8002}"
    github-api:
      url: "https://github.com"
    logging:
      scope: request-response

  # Logging configuration
  log:
    category:
      "org.jboss.resteasy.reactive.client":
        level: "${LOG_LEVEL:INFO}"
      "io.vertx.redis":
        level: "${REDIS_LOG_LEVEL:WARN}"
      "io.quarkus.redis":
        level: "${REDIS_LOG_LEVEL:WARN}"
      "com.plugin.features.auth.core.RedisRepository":
        level: "${REDIS_LOG_LEVEL:INFO}"

openai:
  api.key: "${OPENAI_API_KEY}"
  project.id: "${OPENAI_PROJECT_ID}"
  org.id: "${OPENAI_ORG_ID}"


smallrye:
  jwt:
    new-token:
      lifespan: 600
    sign:
      key:
        location: classpath:META-INF/resources/privateKey-dev.pem

websocket:
  auth:
    path: "/completions/create"
    token-query-param: "token"
    upgrade-header: "upgrade"
    websocket-value: "websocket"

auth:
  access-token-ttl-s: 900  # 15 minutes
  refresh-token-ttl-s: 2592000  # 30 days
  figma:
    client-id: client id
    client-secret: client secret
    auth-url: https://www.figma.com/oauth
    token-url: https://api.figma.com/v1/oauth/token
    login-redirect-uri: http://localhost:8080/auth/figma/callback
    connect-redirect-uri: http://localhost:8080/auth/figma/connect/callback
    user-id:
      result-key-prefix: "figma-user-id:"
    connect:
      redis-key-prefix: "figma-connect:"
    login:
      random-key:
        max-retries: 3
      timeout-sec: 60
    rest-client:
      access-token:
        redis-key-prefix: "figma-login:"
    read-token:
      redis-key-prefix: "figma-read-token:"
    write-token:
      redis-key-prefix: "figma-write-token:"
  github:
    client-id: github-client-id
    client-secret: github-client-secret
    auth-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    login-redirect-uri: http://localhost:8080/auth/github/callback
    connect-redirect-uri: http://localhost:8080/auth/github/connect/callback
    connect:
      result-key-prefix: "github-connect:"
    user-id:
      redis-key-prefix: "github-user-id:"
    login:
      random-key:
        max-retries: 3
      timeout-sec: 60
    rest-client:
      access-token:
        redis-key-prefix: "github-login:"
    read-token:
      redis-key-prefix: "github-read-token:"
    write-token:
      redis-key-prefix: "github-write-token:"

user:
  companion-app-key-prefix: "companion-app:"
  encryption-key-ttl-s: 3600
