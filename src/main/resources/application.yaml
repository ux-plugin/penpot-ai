# Quarkus YAML configuration
quarkus:
  application:
    name: figma-plugin-api

  # HTTP configuration
  http:
    port: "${API_PORT:8003}"
    host: "${API_HOST:0.0.0.0}"

    # CORS configuration
    cors:
      enabled: true
      origins: "*"
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      headers: Authorization,Content-Type,Accept
      exposed-headers: Content-Disposition
      access-control-max-age: 3600

  # OpenAPI and Swagger UI
  swagger-ui:
    always-include: true
    validator-url: none
  smallrye-openapi:
    info-title: Figma Plugin API
    info-version: 0.0.1
    info-description: API for Figma Plugin

  # Database configuration
  datasource:
    db-kind: postgresql
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:password}"
    reactive:
      url: "postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:figma_plugin}"

    # JDBC configuration for liquibase
    jdbc:
      url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:figma_plugin}"
      driver: org.postgresql.Driver

  # Redis configuration
  redis:
    hosts: "${REDIS_HOST:redis://localhost:6379}"
    timeout: 5000

  # Hibernate ORM configuration
  hibernate-orm:
    database:
      generation: none
    log:
      sql: true
    physical-naming-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  # Liquibase configuration
  liquibase:
    migrate-at-start: true
    change-log: db/changelog/master.yaml

  rest-client:
    ai-server:
      url: "${AI_SERVER_URL:http://localhost:8002}"
    github-api:
      url: "https://github.com"
    logging:
      scope: request-response

  # Logging configuration
  log:
    category:
      "org.jboss.resteasy.reactive.client":
        level: "${LOG_LEVEL:DEBUG}"

openai:
  api.key: "${OPENAI_API_KEY}"
  project.id: "${OPENAI_PROJECT_ID}"
  org.id: "${OPENAI_ORG_ID}"


smallrye:
  jwt:
    new-token:
      lifespan: 600
    sign:
      key:
        location: classpath:META-INF/resources/privateKey-dev.pem

auth:
  access-token-ttl-s: 900  # 15 minutes
  refresh-token-ttl-s: 2592000  # 30 days
  figma:
    client-id: client id
    client-secret: client secret
    auth-url: https://www.figma.com/oauth
    token-url: https://api.figma.com/v1/oauth/token
    redirect-uri: http://localhost:8080/auth/figma/callback
    login:
      random-key:
        max-retries: 5
      timeout-sec: 60
    rest-client:
      access-token:
        redis-key-prefix: "figma-login:"
    read-token:
      redis-key-prefix: "figma-read-token:"
    write-token:
      redis-key-prefix: "figma-write-token:"
  github:
    client-id: github-client-id
    client-secret: github-client-secret
    auth-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    redirect-uri: http://localhost:8080/auth/github/callback
    login:
      random-key:
        max-retries: 5
      timeout-sec: 60
    rest-client:
      access-token:
        redis-key-prefix: "github-login:"
    read-token:
      redis-key-prefix: "github-read-token:"
    write-token:
      redis-key-prefix: "github-write-token:"

apps:
  companion-app-key-prefix: "companion-app:"
  plugin-key-prefix: "plugin:"