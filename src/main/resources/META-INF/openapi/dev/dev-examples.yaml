    summary: Regular user creation request
    description: Example request to create a regular user for development
    value:
      id: "dev_user_123456789"
      username: "devuser"
      name: "Development User"
      role: "USER"
      refreshToken: "refresh_token_abc123def456ghi789"
      refreshTokenExpiresAt: "2024-08-06T17:01:00Z"
  
  admin_user:
    summary: Admin user creation request
    description: Example request to create an admin user for development
    value:
      id: "dev_admin_987654321"
      username: "devadmin"
      name: "Development Admin"
      role: "ADMIN"
      refreshToken: "refresh_token_xyz789abc123def456"
      refreshTokenExpiresAt: "2024-08-07T16:01:00Z"
  
