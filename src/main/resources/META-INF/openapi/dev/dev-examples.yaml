ErrorResponses:
  invalid_request:
    summary: Invalid request error
    description: Request contains invalid or malformed data
    value:
      error: "invalid_request"
      message: "The request contains invalid or malformed data"
      timestamp: "2024-08-06T16:01:00Z"
  
  missing_fields:
    summary: Missing required fields error
    description: Request is missing required fields
    value:
      error: "missing_required_fields"
      message: "Required fields are missing: id, username, name, role, refreshAccessToken, refreshTokenExpiresAt"
      timestamp: "2024-08-06T16:01:00Z"
  
  user_exists:
    summary: User already exists error
    description: User with the same ID or username already exists
    value:
      error: "user_already_exists"
      message: "A user with the same ID or username already exists"
      timestamp: "2024-08-06T16:01:00Z"
  
  creation_error:
    summary: User creation error
    description: Error occurred while creating the user
    value:
      error: "user_creation_failed"
      message: "Failed to create user. Please check the data and try again"
      timestamp: "2024-08-06T16:01:00Z"
  
  missing_user_id:
    summary: Missing user ID error
    description: User ID parameter is missing from the request
    value:
      error: "missing_user_id"
      message: "The userId query parameter is required"
      timestamp: "2024-08-06T16:01:00Z"
  
  invalid_user_id:
    summary: Invalid user ID error
    description: User ID format is invalid
    value:
      error: "invalid_user_id"
      message: "The provided userId format is invalid"
      timestamp: "2024-08-06T16:01:00Z"
  
  user_not_found:
    summary: User not found error
    description: User with the specified ID doesn't exist
    value:
      error: "user_not_found"
      message: "No user found with the specified userId"
      timestamp: "2024-08-06T16:01:00Z"