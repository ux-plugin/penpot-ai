AddUserRequest:
  type: object
  description: Request to add a new user for development purposes
  required:
    - id
    - username
    - name
    - role
    - refreshToken
    - refreshTokenExpiresAt
  properties:
    id:
      type: string
      description: Unique user identifier
      example: "dev_user_123456789"
    username:
      type: string
      description: User's username
      example: "devuser"
    name:
      type: string
      description: User's display name
      example: "Development User"
    role:
      $ref: "../common/common-schemas.yaml#/UserRole"
    refreshToken:
      type: string
      description: Refresh token for the user
      example: "refresh_token_abc123def456ghi789"
    refreshTokenExpiresAt:
      $ref: "../common/common-schemas.yaml#/Instant"
  examples:
    - id: "dev_user_123456789"
      username: "devuser"
      name: "Development User"
      role: "USER"
      refreshToken: "refresh_token_abc123def456ghi789"
      refreshTokenExpiresAt: "2024-08-06T17:01:00Z"
    - id: "dev_admin_987654321"
      username: "devadmin"
      name: "Development Admin"
      role: "ADMIN"
      refreshToken: "refresh_token_xyz789abc123def456"
      refreshTokenExpiresAt: "2024-08-07T16:01:00Z"
    - id: "test_user_555666777"
      username: "testuser"
      name: "Test User Account"
      role: "USER"
      refreshToken: "refresh_token_test123test456test789"
      refreshTokenExpiresAt: "2024-08-08T16:01:00Z"

AddUserResponse:
  type: object
  description: Response after successfully adding a user
  required:
    - accessToken
  properties:
    accessToken:
      type: string
      description: JWT access token for the newly created user
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkZXZfdXNlcl8xMjM0NTY3ODkiLCJpYXQiOjE3MjMwNDQwNjAsImV4cCI6MTcyMzA0NzY2MH0.new_user_token_hash"
  examples:
    - accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkZXZfdXNlcl8xMjM0NTY3ODkiLCJpYXQiOjE3MjMwNDQwNjAsImV4cCI6MTcyMzA0NzY2MH0.dev_user_token"
    - accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkZXZfYWRtaW5fOTg3NjU0MzIxIiwiaWF0IjoxNzIzMDQ0MDYwLCJleHAiOjE3MjMwNDc2NjB9.dev_admin_token"
    - accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0X3VzZXJfNTU1NjY2Nzc3IiwiaWF0IjoxNzIzMDQ0MDYwLCJleHAiOjE3MjMwNDc2NjB9.test_user_token"