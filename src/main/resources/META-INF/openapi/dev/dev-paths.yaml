/dev/user/add:
  post:
    summary: Add a new user (Dev only)
    description: Creates a new user in the system for development purposes
    tags:
      - User Management (Dev)
    requestBody:
      content:
        application/json:
          schema:
            $ref: "./dev-schemas.yaml#/AddUserRequest"
          examples:
            regular_user:
              $ref: "./dev-examples.yaml#/AddUserRequest/regular_user"
            admin_user:
              $ref: "./dev-examples.yaml#/AddUserRequest/admin_user"
            test_user:
              $ref: "./dev-examples.yaml#/AddUserRequest/test_user"
      required: true
    responses:
      "200":
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: "./dev-schemas.yaml#/AddUserResponse"
            examples:
              user_created:
                $ref: "./dev-examples.yaml#/AddUserResponse/user_created"
              admin_created:
                $ref: "./dev-examples.yaml#/AddUserResponse/admin_created"
      "400":
        description: Bad Request
        content:
          application/json:
            examples:
              invalid_request:
                $ref: "./dev-examples.yaml#/ErrorResponses/invalid_request"
              missing_fields:
                $ref: "./dev-examples.yaml#/ErrorResponses/missing_fields"
              user_exists:
                $ref: "./dev-examples.yaml#/ErrorResponses/user_exists"
      "500":
        description: Internal server error - failed to create user
        content:
          application/json:
            examples:
              creation_error:
                $ref: "./dev-examples.yaml#/ErrorResponses/creation_error"

/dev/user/jwt:
  get:
    summary: Get JWT token for user (Dev only)
    description: Generates a JWT token for the specified user ID for development purposes
    tags:
      - User Management (Dev)
    parameters:
      - description: User ID to generate JWT token for
        required: true
        name: userId
        in: query
        schema:
          type: string
        example: "dev_user_123456789"
    responses:
      "200":
        description: JWT token generated successfully
        content:
          application/json:
            schema:
              $ref: "../auth/auth-schemas.yaml#/GetJwtResponse"
            examples:
              user_jwt:
                $ref: "./dev-examples.yaml#/GetJwtResponse/user_jwt"
              admin_jwt:
                $ref: "./dev-examples.yaml#/GetJwtResponse/admin_jwt"
              test_jwt:
                $ref: "./dev-examples.yaml#/GetJwtResponse/test_jwt"
      "400":
        description: Bad request - missing or invalid userId
        content:
          application/json:
            examples:
              missing_user_id:
                $ref: "./dev-examples.yaml#/ErrorResponses/missing_user_id"
              invalid_user_id:
                $ref: "./dev-examples.yaml#/ErrorResponses/invalid_user_id"
              user_not_found:
                $ref: "./dev-examples.yaml#/ErrorResponses/user_not_found"