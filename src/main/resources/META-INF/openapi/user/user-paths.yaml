openapi: 3.1.0
info:
  contact:
    email: support@example.com
    name: Support
  description: User Management API for Figma Plugin
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: User Management API
  version: 0.0.1

tags:
  - name: User Management
    description: User profile and configuration management endpoints

paths:
  /user/{userId}:
    get:
      summary: Get user profile
      description: Retrieves the user profile and configuration for the specified user ID
      tags:
        - User Management
      parameters:
        - description: User ID
          required: true
          name: userId
          in: path
          schema:
            type: string
          example: "user_123456789"
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "./user-schemas.yaml#/GetUserResponse"
              examples:
                regular_user:
                  $ref: "./user-examples.yaml#/GetUserResponse/regular_user"
                admin_user:
                  $ref: "./user-examples.yaml#/GetUserResponse/admin_user"
                user_with_completions_disabled:
                  $ref: "./user-examples.yaml#/GetUserResponse/user_with_completions_disabled"
        "401":
          description: Unauthorized - authentication failed
          content:
            application/json:
              examples:
                unauthorized:
                  $ref: "./user-examples.yaml#/ErrorResponses/unauthorized"
        "403":
          description: Forbidden - user can only access their own profile
          content:
            application/json:
              examples:
                forbidden:
                  $ref: "./user-examples.yaml#/ErrorResponses/forbidden"
        "404":
          description: User not found
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: "./user-examples.yaml#/ErrorResponses/user_not_found"
      security:
        - JWT: [ ]

  /user/key:
    post:
      summary: Generate encryption key
      description: Generates a new AES-256 encryption key for the authenticated user
      tags:
        - User Management
      responses:
        "200":
          description: Encryption key generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: Base64-encoded AES-256 encryption key
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the encryption key expires
        "404":
          description: User not found
        "500":
          description: Internal server error
      security:
        - JWT: [ ]
    get:
      summary: Get encryption key
      description: Retrieves the current encryption key for the authenticated user
      tags:
        - User Management
      responses:
        "200":
          description: Encryption key retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: Base64-encoded AES-256 encryption key
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the encryption key expires
        "500":
          description: Internal server error
      security:
        - JWT: [ ]

  /user/port:
    post:
      summary: Update port configuration
      description: Updates the port configuration for the authenticated user and broadcasts to subscribers
      tags:
        - User Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                port:
                  type: integer
                  nullable: true
                  description: Port number for companion app
        required: true
      responses:
        "200":
          description: Port configuration updated successfully
        "500":
          description: Internal server error
      security:
        - JWT: [ ]

  /user/port/listen:
    get:
      summary: Listen to port updates
      description: Server-Sent Events stream for real-time port configuration updates
      tags:
        - User Management
      responses:
        "200":
          description: SSE stream of port updates
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  port:
                    type: integer
                    nullable: true
                    description: Port number for companion app
      security:
        - JWT: [ ]

  /user/{userId}/update:
    post:
      summary: Update user profile
      description: Updates the user profile and configuration for the specified user ID
      tags:
        - User Management
      parameters:
        - description: User ID
          required: true
          name: userId
          in: path
          schema:
            type: string
          example: "user_123456789"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./user-schemas.yaml#/UpdateUserRequest"
            examples:
              full_update:
                $ref: "./user-examples.yaml#/UpdateUserRequest/full_update"
              partial_update_name:
                $ref: "./user-examples.yaml#/UpdateUserRequest/partial_update_name"
              partial_update_username:
                $ref: "./user-examples.yaml#/UpdateUserRequest/partial_update_username"
              toggle_completions:
                $ref: "./user-examples.yaml#/UpdateUserRequest/toggle_completions"
        required: true
      responses:
        "200":
          description: User profile updated successfully
          content:
            application/json:
              examples:
                update_success:
                  $ref: "./user-examples.yaml#/UpdateResponses/update_success"
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                invalid_request:
                  $ref: "./user-examples.yaml#/ErrorResponses/invalid_request"
                username_taken:
                  $ref: "./user-examples.yaml#/ErrorResponses/username_taken"
        "401":
          description: Unauthorized - authentication failed
          content:
            application/json:
              examples:
                unauthorized:
                  $ref: "./user-examples.yaml#/ErrorResponses/unauthorized"
        "403":
          description: Forbidden - user can only update their own profile
          content:
            application/json:
              examples:
                forbidden:
                  $ref: "./user-examples.yaml#/ErrorResponses/forbidden"
        "404":
          description: User not found
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: "./user-examples.yaml#/ErrorResponses/user_not_found"
      security:
        - JWT: [ ]

  /user/{userId}/delete:
    delete:
      summary: Delete user profile
      description: Deletes the user profile and all associated data for the specified user ID
      tags:
        - User Management
      parameters:
        - description: User ID
          required: true
          name: userId
          in: path
          schema:
            type: string
          example: "user_123456789"
      responses:
        "200":
          description: User profile deleted successfully
          content:
            application/json:
              examples:
                delete_success:
                  $ref: "./user-examples.yaml#/DeleteResponses/delete_success"
        "401":
          description: Unauthorized - authentication failed
          content:
            application/json:
              examples:
                unauthorized:
                  $ref: "./user-examples.yaml#/ErrorResponses/unauthorized"
        "403":
          description: Forbidden - user can only delete their own profile
          content:
            application/json:
              examples:
                forbidden:
                  $ref: "./user-examples.yaml#/ErrorResponses/forbidden"
        "404":
          description: User not found
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: "./user-examples.yaml#/ErrorResponses/user_not_found"
        "500":
          description: Internal server error - failed to delete user
          content:
            application/json:
              examples:
                delete_error:
                  $ref: "./user-examples.yaml#/ErrorResponses/delete_error"
      security:
        - JWT: [ ]
