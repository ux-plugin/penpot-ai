servers:
  production:
    host: localhost:8080
    protocol: ws
    description: Local development WebSocket server
    tags:
      - name: env:development
        description: Development environment

channels:
  completionsCreate:
    address: /completions/create
    messages:
      refreshToken:
        $ref: '#/components/messages/RefreshToken'
      completionRequest:
        $ref: '#/components/messages/CompletionRequest'
      completionRequestEnd:
        $ref: '#/components/messages/CompletionRequestEnd'
      completionResponse:
        $ref: '#/components/messages/CompletionResponse'
      completionResponseEnd:
        $ref: '#/components/messages/CompletionResponseEnd'
      acknowledgment:
        $ref: '#/components/messages/Acknowledgment'
    description: |
      WebSocket channel for real-time component creation with command-based messaging.
      
      **Authentication Required**: This channel requires a valid JWT token with a non-empty subject.
      
      **Message Types**:
      - `refresh_token`: Update JWT token during active session
      - `completion_request`: Stream drawing and audio data chunks
      - `completion_request_end`: Signal end of request stream
      - `completion_response`: Server sends AI-generated component actions
      - `completion_response_end`: Signal end of response stream
      
      **Bidirectional Communication**:
      - Client sends: refresh_token, completion_request, completion_request_end
      - Server sends: completion_response, completion_response_end, acknowledgments
      
      **Error Conditions**:
      - Missing or invalid JWT: Connection closed with code 1008 (VIOLATED_POLICY)
      - Message processing errors: JSON error response sent to client
      - Connection errors: Automatic cleanup of session resources

operations:
  sendRefreshToken:
    action: send
    channel:
      $ref: '#/channels/completionsCreate'
    messages:
      - $ref: '#/channels/completionsCreate/messages/refreshToken'
    description: |
      Send a token refresh command to update the JWT during an active session.
      
      This allows the client to refresh authentication without reconnecting.

  sendCompletionRequest:
    action: send
    channel:
      $ref: '#/channels/completionsCreate'
    messages:
      - $ref: '#/channels/completionsCreate/messages/completionRequest'
    description: |
      Send streaming component creation data to the server.
      
      Clients send multiple messages during the drawing/recording phase, each containing:
      - `fe_id`: Frontend-generated correlation ID
      - `drawn_path`: Incremental SVG path data
      - `audio_chunk`: Base64-encoded audio segment
      - `timestamp`: Capture time in milliseconds

  sendCompletionRequestEnd:
    action: send
    channel:
      $ref: '#/channels/completionsCreate'
    messages:
      - $ref: '#/channels/completionsCreate/messages/completionRequestEnd'
    description: |
      Signal the end of a completion request stream.
      
      After sending this command, the server begins processing all accumulated data
      for the specified `fe_id` and will respond with completion_response messages.

  receiveCompletionResponse:
    action: receive
    channel:
      $ref: '#/channels/completionsCreate'
    messages:
      - $ref: '#/channels/completionsCreate/messages/completionResponse'
    description: |
      Receive AI-generated component actions from the server.
      
      The server streams multiple response messages containing instructions for
      rendering the generated component. Each message includes:
      - `fe_id`: Correlation ID matching the original request
      - `action`: Action type (e.g., "create_node", "set_property")
      - `target`: Target element or node
      - `params`: Action-specific parameters

  receiveCompletionResponseEnd:
    action: receive
    channel:
      $ref: '#/channels/completionsCreate'
    messages:
      - $ref: '#/channels/completionsCreate/messages/completionResponseEnd'
    description: |
      Receive signal indicating the completion response stream has ended.
      
      After receiving this message, the client knows all actions for the
      specified `fe_id` have been transmitted.

  receiveAcknowledgment:
    action: receive
    channel:
      $ref: '#/channels/completionsCreate'
    messages:
      - $ref: '#/channels/completionsCreate/messages/acknowledgment'
    description: |
      Receive acknowledgment messages from the server.
      
      The server responds with JSON acknowledgments containing status information.

components:
  messages:
    RefreshToken:
      name: RefreshToken
      title: Refresh Token Command
      summary: Update JWT authentication token during active session
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RefreshTokenPayload'
      examples:
        - name: tokenRefresh
          summary: Refresh authentication token
          payload:
            event: "refresh_token"
            token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

    CompletionRequest:
      name: CompletionRequest
      title: Completion Request Command
      summary: Stream drawing and audio data for component generation
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CompletionRequestPayload'
      examples:
        - name: buttonDrawing
          summary: Drawing a button with voice description
          payload:
            event: "completion_request"
            fe_id: "req_1234567890"
            drawn_path: "M 0 0 L 120 0 L 120 40 L 0 40 Z"
            audio_chunk: "UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="
            timestamp: 1734041923456
        - name: cardDrawingIncremental
          summary: Incremental path data during drawing
          payload:
            event: "completion_request"
            fe_id: "req_1234567890"
            drawn_path: "M 10 10 L 310 10"
            audio_chunk: "UklGRjQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAA="
            timestamp: 1734041924789

    CompletionRequestEnd:
      name: CompletionRequestEnd
      title: Completion Request End Command
      summary: Signal end of completion request stream
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CompletionRequestEndPayload'
      examples:
        - name: requestComplete
          summary: Signal that drawing/recording is complete
          payload:
            event: "completion_request_end"
            fe_id: "req_1234567890"

    CompletionResponse:
      name: CompletionResponse
      title: Completion Response Command
      summary: AI-generated component action from server
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CompletionResponsePayload'
      examples:
        - name: createNode
          summary: Create a button node
          payload:
            event: "completion_response"
            fe_id: "req_1234567890"
            action: "create_node"
            target: "button_main"
            params: '{"type":"RECTANGLE","width":120,"height":40}'
        - name: setProperty
          summary: Set button text content
          payload:
            event: "completion_response"
            fe_id: "req_1234567890"
            action: "set_text"
            target: "button_main"
            params: '{"text":"Click Me","fontSize":16}'

    CompletionResponseEnd:
      name: CompletionResponseEnd
      title: Completion Response End Command
      summary: Signal end of completion response stream
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CompletionResponseEndPayload'
      examples:
        - name: responseComplete
          summary: Signal that all component actions have been sent
          payload:
            event: "completion_response_end"
            fe_id: "req_1234567890"

    Acknowledgment:
      name: Acknowledgment
      title: Server Acknowledgment
      summary: JSON acknowledgment that command was processed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AcknowledgmentPayload'
      examples:
        - name: success
          summary: Successful processing acknowledgment
          payload:
            status: "ok"
            fe_id: "req_1234567890"
        - name: tokenRefreshSuccess
          summary: Token refresh acknowledgment
          payload:
            status: "ok"
            message: "Token refresh not yet implemented"

  schemas:
    RefreshTokenPayload:
      type: object
      description: Payload for refreshing JWT token during active session
      required:
        - event
        - token
      properties:
        event:
          type: string
          const: "refresh_token"
          description: Command discriminator
        token:
          type: string
          description: New JWT token to use for authentication
          minLength: 1
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

    CompletionRequestPayload:
      type: object
      description: Payload for streaming drawing and audio data
      required:
        - event
        - fe_id
        - drawn_path
        - audio_chunk
        - timestamp
      properties:
        event:
          type: string
          const: "completion_request"
          description: Command discriminator
        fe_id:
          type: string
          description: |
            Frontend-generated unique identifier for this completion request.
            Used to correlate all messages in the request/response cycle.
          example: "req_1234567890"
          minLength: 1
        drawn_path:
          type: string
          description: |
            SVG path data representing the user's drawing.
            
            Can be incremental (sent as user draws) or complete path.
            Uses standard SVG path syntax with commands like:
            - M (moveto)
            - L (lineto)
            - Q (quadratic Bezier curve)
            - C (cubic Bezier curve)
            - Z (closepath)
          example: "M 0 0 L 100 100 Z"
          minLength: 1
        audio_chunk:
          type: string
          format: byte
          description: |
            Base64-encoded audio data chunk from the user's voice input.
            
            The audio format should be PCM WAV data encoded in base64.
            Each chunk represents a small segment of continuous audio recording.
          example: "UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="
          minLength: 1
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the data was captured
          minimum: 0
          example: 1734041923456

    CompletionRequestEndPayload:
      type: object
      description: Payload signaling end of completion request stream
      required:
        - event
        - fe_id
      properties:
        event:
          type: string
          const: "completion_request_end"
          description: Command discriminator
        fe_id:
          type: string
          description: Frontend ID matching the completion request
          example: "req_1234567890"
          minLength: 1

    CompletionResponsePayload:
      type: object
      description: Payload containing AI-generated component action
      required:
        - event
        - fe_id
        - action
        - target
        - params
      properties:
        event:
          type: string
          const: "completion_response"
          description: Command discriminator
        fe_id:
          type: string
          description: Frontend ID matching the original completion request
          example: "req_1234567890"
          minLength: 1
        action:
          type: string
          description: |
            Action type to perform on the component.
            
            Common actions include:
            - create_node: Create a new Figma node
            - set_property: Set node property value
            - set_text: Set text content
            - set_style: Apply visual styling
            - add_constraint: Add layout constraint
          example: "create_node"
          minLength: 1
        target:
          type: string
          description: |
            Target identifier for the action.
            
            Typically a node ID or element reference that the action applies to.
          example: "button_main"
          minLength: 1
        params:
          type: string
          description: |
            JSON-encoded parameters for the action.
            
            Structure varies based on action type. Examples:
            - create_node: {"type":"RECTANGLE","width":120,"height":40}
            - set_text: {"text":"Click Me","fontSize":16}
            - set_style: {"fill":"#007AFF","cornerRadius":8}
          example: '{"type":"RECTANGLE","width":120,"height":40}'
          minLength: 1

    CompletionResponseEndPayload:
      type: object
      description: Payload signaling end of completion response stream
      required:
        - event
        - fe_id
      properties:
        event:
          type: string
          const: "completion_response_end"
          description: Command discriminator
        fe_id:
          type: string
          description: Frontend ID matching the completion request and responses
          example: "req_1234567890"
          minLength: 1

    AcknowledgmentPayload:
      type: object
      description: JSON acknowledgment response from server
      required:
        - status
      properties:
        status:
          type: string
          description: Status of the command processing
          enum: ["ok", "error"]
          example: "ok"
        fe_id:
          type: string
          description: Frontend ID if applicable to the acknowledged command
          example: "req_1234567890"
        message:
          type: string
          description: Optional message with additional information
          example: "Token refresh not yet implemented"

  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication token required for WebSocket connection.
        
        **Token Requirements**:
        - Must contain a non-null, non-blank `subject` claim (user ID)
        - Token is validated using custom `QueryParamJwtAuthMechanism`
        - Uses Quarkus SmallRye JWT for validation
        - Standard JWT format with valid signature
        
        **How to Provide Token**:
        - Must be provided as query parameter during WebSocket upgrade
        - Format: `ws://localhost:8080/completions/create?token=YOUR_JWT_TOKEN`
        - Parameter name: `token`
        
        **Token Refresh**:
        - Tokens can be refreshed during active session using `refresh_token` command
        - Allows maintaining connection without reconnecting
        
        **Validation Behavior**:
        - Custom mechanism extracts token from query parameter
        - JWT signature and expiration are validated
        - On success: User ID extracted from `subject`, `SecurityIdentity` created, connection established
        - On failure: Connection closed with WebSocket close code 1008 (VIOLATED_POLICY)
        - On error: Connection closed with appropriate error code
        
        **Note**: REST endpoints (`/completions`, `/completions/{id}`) continue to use 
        Authorization header authentication (`Authorization: Bearer TOKEN`). The query 
        parameter authentication is specific to the WebSocket endpoint only.
