asyncapi: 3.0.0
info:
  title: Component Completions WebSocket API
  version: 0.1.0
  description: |
    WebSocket API for real-time component creation with command-based messaging.
    
    This API enables bidirectional communication between client and server using a command-based
    architecture. Commands are distinguished by an `event` discriminator property that determines
    the message type and expected payload structure.
    
    ## Architecture Overview
    
    The WebSocket uses a **command-based messaging pattern** where each message contains:
    - `event`: String discriminator identifying the command type
    - Command-specific payload fields
    
    All commands follow a JSON structure and are processed by dedicated handlers on the server.
    
    ## Authentication
    
    This WebSocket endpoint requires JWT authentication via a custom `HttpAuthenticationMechanism`
    that extracts the token from a query parameter. The JWT token must be provided as a query
    parameter during the WebSocket connection upgrade request.
    
    **Authentication Method**:
    - **Query Parameter**: `ws://localhost:8080/completions/create?token=YOUR_JWT_TOKEN`
    
    **Authentication Implementation**:
    - Custom `QueryParamJwtAuthMechanism` with priority 1000 (runs before default JWT auth)
    - Mechanism only handles WebSocket upgrade requests to `/completions/create`
    - All other requests (REST endpoints) use standard Authorization header authentication
    - JWT token is validated using Quarkus SmallRye JWT
    
    **Authentication Validation**:
    - Token is extracted from the `token` query parameter
    - JWT signature and claims are validated
    - User ID is extracted from `JWT.subject`
    - If token is missing, invalid, or subject is null/blank, connection is rejected
    - Failed authentication results in connection closure with error code 1008 (VIOLATED_POLICY)
    - Successful authentication creates a proper `SecurityIdentity` and stores user ID for session lifetime
    
    ## Message Flow
    
    ### Completion Request Flow (Client → Server → Client)
    
    1. **Token Refresh** (Optional):
       - Client: `refresh_token` command with new JWT
       - Server: Acknowledgment response
    
    2. **Request Streaming Phase**:
       - Client: Multiple `completion_request` commands with drawing/audio data
       - Each command includes: `fe_id`, `drawn_path`, `audio_chunk`, `timestamp`
       - Server: JSON acknowledgment for each message
    
    3. **Request End**:
       - Client: `completion_request_end` command with `fe_id`
       - Server: Acknowledgment and begins processing
    
    4. **Response Streaming Phase**:
       - Server: Multiple `completion_response` commands with AI-generated actions
       - Each command includes: `fe_id`, `action`, `target`, `params`
       - Client: Processes and renders component actions
    
    5. **Response End**:
       - Server: `completion_response_end` command with `fe_id`
       - Flow complete for this request
    
    ## Frontend ID Correlation
    
    The `fe_id` (frontend ID) field is used to correlate related messages in a request/response cycle:
    - Generated by the client for each new completion request
    - Included in all messages related to that specific request
    - Allows multiple concurrent completion requests on the same WebSocket connection
    - Server echoes the `fe_id` in all response messages
    
    ## Connection Lifecycle
    
    1. **Connection Establishment** (`@OnOpen`):
       - JWT token is validated
       - User ID is extracted from token subject
       - Session is initialized and mapped to user ID
    
    2. **Message Processing** (`@OnMessage`):
       - Server decodes JSON command using `event` discriminator
       - Command is routed to appropriate handler via `CommandDispatcher`
       - Handler processes command and returns JSON response
       - Server sends response back to client
    
    3. **Connection Closure** (`@OnClose`):
       - All session resources are cleaned up
       - User ID to session mappings are removed
    
    4. **Error Handling** (`@OnError`):
       - Logs error with session and user information
       - Cleans up all session resources
  contact:
    name: Support
    email: support@example.com
  license:
    name: Apache 2.0
