AppState:
  type: object
  description: Application state configuration
  properties:
    port:
      type: integer
      nullable: true
      format: int32
      description: Application port number
      example: 3000
  examples:
    - port: 3000
    - port: 8080
    - port: null
    - {}

GenerateKeyResponse:
  type: object
  description: Response containing generated encryption key
  required:
    - key
  properties:
    key:
      type: string
      description: Generated AES-256 encryption key (base64 encoded)
      example: "dGhpcyBpcyBhIHNhbXBsZSBrZXkgZm9yIGV4YW1wbGUgcHVycG9zZXM="
  examples:
    - key: "dGhpcyBpcyBhIHNhbXBsZSBrZXkgZm9yIGV4YW1wbGUgcHVycG9zZXM="
    - key: "YW5vdGhlciBleGFtcGxlIGVuY3J5cHRpb24ga2V5IGZvciBkZW1v"
    - key: "c2VjdXJlX2VuY3J5cHRpb25fa2V5X2Zvcl9jb25maWd1cmF0aW9u"

GetKeyResponse:
  type: object
  description: Response containing existing encryption key
  properties:
    key:
      type: string
      nullable: true
      description: Existing AES-256 encryption key (base64 encoded), null if no key exists
      example: "dGhpcyBpcyBhIHNhbXBsZSBrZXkgZm9yIGV4YW1wbGUgcHVycG9zZXM="
  examples:
    - key: "dGhpcyBpcyBhIHNhbXBsZSBrZXkgZm9yIGV4YW1wbGUgcHVycG9zZXM="
    - key: "ZXhpc3RpbmdfZW5jcnlwdGlvbl9rZXlfZm9yX3VzZXJfY29uZmln"
    - key: null