AppState:
  set_port:
    summary: Set application port
    description: Example request to set the application port
    value:
      port: 3000
  
  clear_port:
    summary: Clear application port
    description: Example request to clear the application port
    value:
      port: null
  
  empty_config:
    summary: Empty configuration
    description: Example request with empty configuration
    value: { }

GenerateKeyResponse:
  new_key:
    summary: Newly generated encryption key
    description: Example response with a newly generated encryption key
    value:
      key: "dGhpcyBpcyBhIHNhbXBsZSBrZXkgZm9yIGV4YW1wbGUgcHVycG9zZXM="
  
  regenerated_key:
    summary: Regenerated encryption key
    description: Example response when regenerating an existing key
    value:
      key: "bmV3X2VuY3J5cHRpb25fa2V5X2Zvcl9yZWdlbmVyYXRpb25fZXhhbXBsZQ=="

GetKeyResponse:
  existing_key:
    summary: Existing encryption key
    description: Example response with an existing encryption key
    value:
      key: "ZXhpc3RpbmdfZW5jcnlwdGlvbl9rZXlfZm9yX3VzZXJfY29uZmln"
  
  no_key:
    summary: No encryption key found
    description: Example response when user has no encryption key
    value:
      key: null

UpdateResponses:
  update_success:
    summary: Configuration update success
    description: Response when app configuration is updated successfully
    value:
      message: "App configuration updated successfully"
      success: true
      timestamp: "2024-08-06T16:01:00Z"

SSEEvents:
  port_update_event:
    summary: Port update SSE event
    description: Example Server-Sent Event for port configuration update
    value: |
      event: config-update
      data: {"port": 3000}
      id: event_123456789
  
  config_clear_event:
    summary: Configuration clear SSE event
    description: Example Server-Sent Event for clearing configuration
    value: |
      event: config-update
      data: {"port": null}
      id: event_987654321

ErrorResponses:
  unauthorized:
    summary: Unauthorized error
    description: User not authenticated
    value:
      error: "unauthorized"
      message: "Authentication required. Please provide a valid JWT token"
      timestamp: "2024-08-06T16:01:00Z"
  
  invalid_config:
    summary: Invalid configuration error
    description: Configuration data is invalid
    value:
      error: "invalid_configuration"
      message: "The provided configuration data is invalid or malformed"
      timestamp: "2024-08-06T16:01:00Z"
  
  update_error:
    summary: Configuration update error
    description: Error occurred while updating configuration
    value:
      error: "update_failed"
      message: "Failed to update app configuration. Please try again later"
      timestamp: "2024-08-06T16:01:00Z"
  
  user_not_found:
    summary: User not found error
    description: User doesn't exist in the system
    value:
      error: "user_not_found"
      message: "The authenticated user was not found in the system"
      timestamp: "2024-08-06T16:01:00Z"
  
  key_generation_error:
    summary: Key generation error
    description: Error occurred while generating encryption key
    value:
      error: "key_generation_failed"
      message: "Failed to generate encryption key. Please try again later"
      timestamp: "2024-08-06T16:01:00Z"
  
  key_retrieval_error:
    summary: Key retrieval error
    description: Error occurred while retrieving encryption key
    value:
      error: "key_retrieval_failed"
      message: "Failed to retrieve encryption key. Please try again later"
      timestamp: "2024-08-06T16:01:00Z"